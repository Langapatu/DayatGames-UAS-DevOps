name: dayatgames

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dayatgames_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
    networks:
      - dayatgames_network
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:1.29-alpine
    container_name: dayatgames_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - vendor_data:/var/www/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dayatgames_network
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: dayatgames_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dayatgames
      MYSQL_USER: dayatgames_user
      MYSQL_PASSWORD: dayatgames_local_password
      MYSQL_ROOT_PASSWORD: dayatgames_local_root_password
    volumes:
      - dayatgames_db_data:/var/lib/mysql
    networks:
      - dayatgames_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: dayatgames_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    networks:
      - dayatgames_network
    depends_on:
      db:
        condition: service_healthy

networks:
  dayatgames_network:
    driver: bridge

volumes:
  dayatgames_db_data:
  vendor_data:
